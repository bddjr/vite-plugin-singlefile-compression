name: Deploy

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: "12"
          runtime: node@lts
          install: true

      - run: pnpm build

      - name: Upload static files as artifact
        if: github.event_name == 'push' && github.ref_name == 'main'
        id: deployment
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
